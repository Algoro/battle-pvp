<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle City — симулятор (без эмулятора)</title>
    <style>
      body { background: #111; color: #eee; font-family: monospace; display: flex; gap: 20px; align-items: flex-start; padding: 20px; }
      canvas { image-rendering: pixelated; border: 2px solid #444; width: 512px; height: 480px; }
      .side { max-width: 320px; }
      h1 { font-size: 15px; }
      #hud { background: #222; padding: 10px; border-radius: 6px; white-space: pre-wrap; }
      p { font-size: 12px; color: #aaa; line-height: 1.5; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <div class="side">
      <h1>Симулятор GameSim — уровень без эмулятора</h1>
      <div id="hud">Запуск…</div>
      <p>Это JS-симулятор (CycleSim/GameSim), не NES-эмулятор. Враги спавнятся и идут к базе,
        защитники стреляют, пули летят, кирпичи разрушаются. Зелёный = игрок, красный = враг,
        оранжевый = кирпич, точка = пуля.</p>
    </div>
    <script type="module" src="/src/demo-sim.ts"></script>
  </body>
</html>
